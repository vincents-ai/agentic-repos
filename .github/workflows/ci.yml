name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Security and code quality checks
  security:
    name: Security & Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        
    - name: Nix Cache
      uses: cachix/cachix-action@v12
      with:
        name: devenv
        
    - name: Security audit
      run: |
        nix develop -c -- cargo audit --db ./cargo-audit-db --color always || true
        
    - name: Check for cargo vulnerabilities
      run: |
        nix develop -c -- cargo audit --json > security-report.json || true
        
    - name: Code formatting check
      run: |
        nix develop -c -- cargo fmt --all -- --check
        
    - name: Clippy linting
      run: |
        nix develop -c -- cargo clippy --all-targets --all-features
        
    - name: Upload security report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: security-report
        path: security-report.json

  # Build and test
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: security
    steps:
    - uses: actions/checkout@v6
    
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        
    - name: Nix Cache
      uses: cachix/cachix-action@v12
      with:
        name: devenv
        
    - name: Build project
      run: |
        nix develop -c -- cargo build --release --all-features
        
    - name: Run unit tests
      run: |
        nix develop -c -- cargo test --all-features --workspace
        
    - name: Generate test coverage
      run: |
        nix develop -c -- cargo tarpaulin --out xml --output-dir coverage/
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always()
      with:
        file: coverage/cobertura.xml
        fail_ci_if_error: false

  # NOTE: VM Integration Tests are not yet implemented
  # The integration tests run as part of the Build & Test job via `cargo test`
  # which includes git_integration_tests.rs and lfs_integration_test.rs
  # 
  # Future work: Implement full VM-based end-to-end tests using NixOS test framework
  # for testing complete server deployment scenarios (SSH, multi-client, storage backends)

  # Performance benchmarks
  # NOTE: Benchmarks are disabled because no benchmarks are currently defined
