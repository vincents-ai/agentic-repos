  #   - uses: actions/checkout@v6
  #   
  #   - name: Install Nix
  #     uses: cachix/install-nix-action@v31
  #     with:
  #       nix_path: nixpkgs=channel:nixos-unstable
  #       
  #   - name: Run benchmarks
  #     run: |
  #       nix develop -c -- cargo bench --bench '*' -- --output-format bencher | tee benchmark-results.txt
  #       
  #   - name: Store benchmark results
  #     uses: benchmark-action/github-action-benchmark@v1
  #     if: always()
  #     with:
  #       tool: 'cargo'
  #       output-file-path: benchmark-results.txt
  #       github-token: ${{ secrets.GITHUB_TOKEN }}
  #       auto-push: true

  # Build Docker image (if needed)
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v6
    
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        
    - name: Build Docker image with Nix
      run: |
        nix build .#dockerImage
        docker load < result
        
    - name: Test Docker image
      run: |
        docker run --rm repos-mcp:latest --version
        
    - name: Login to Container Registry
      uses: docker/login-action@v3
      if: success()
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Push Docker image
      if: success()
      run: |
        docker tag repos-mcp:latest ghcr.io/${{ github.repository }}:latest
        docker tag repos-mcp:latest ghcr.io/${{ github.repository }}:${{ github.sha }}
        docker push ghcr.io/${{ github.repository }}:latest
        docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  # NOTE: Dependency Review and CodeQL are disabled because they require
  # GitHub Advanced Security (GHAS), which is not enabled for this private repository.
  # GHAS is free for public repositories but requires a license for private repos.
  # 
  # To enable these features:
  # 1. Enable GHAS in repository settings: Settings > Security & Analysis
  # 2. Uncomment the jobs below
