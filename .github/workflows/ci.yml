name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v17

      - name: Cargo fmt
        run: nix develop -c -- cargo fmt --check

      - name: Cargo clippy
        run: nix develop -c -- cargo clippy -- -D warnings

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v17

      - name: Run unit tests
        run: |
          nix develop -c -- bash -lc "RUST_BACKTRACE=1 cargo test --lib -- --nocapture --test-threads=1"

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v17

      - name: Install podman (for SeaweedFS S3 tests)
        run: |
          sudo apt-get update && sudo apt-get install -y podman

      - name: Run E2E tests
        run: |
          nix develop -c -- bash -lc "RUST_BACKTRACE=1 cargo test --test e2e -- --nocapture --test-threads=1"
        timeout-minutes: 30
