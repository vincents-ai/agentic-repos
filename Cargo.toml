[package]
name = "repos-mcp"
version = "0.1.0"
edition = "2021"
description = "Multi-tenant Git server with MCP integration (AGPLv3)"
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Skylet Plugin ABI (for FFI plugin integration)
skylet-abi = { git = "ssh://git@github.com/vincents-ai/skylet.git", default-features = false }
# Web framework
actix-web = "4.4"
actix-cors = "0.7"
actix-files = "0.6"

# Web UI (Commercial Feature)
tera = "1.19"
mime_guess = "2.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Git operations
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

# SSH Server (for Git over SSH)
russh = "0.49"
russh-keys = "0.49"

# Git protocol implementation (pure Rust)
gix-protocol = "0.55"
gix-transport = "0.52"

# S3 Storage
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Authentication
jsonwebtoken = "9.2"
bcrypt = "0.18"
sha2 = "0.10"

# MCP Protocol
bytes = "1.5"
uuid = { version = "1.6", features = ["v4", "serde"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
async-trait = "0.1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# Utilities
walkdir = "2.4"
tempfile = "3.8"
thiserror = "2.0"
regex = "1.10"
http = "1.0"
rand_core = "0.6"

# Metrics
prometheus = "0.13"
lazy_static = "1.4"

# Concurrency utilities (for Skynet plugin)
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.14"
serial_test = "3.0"
