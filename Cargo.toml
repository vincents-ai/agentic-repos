[workspace]
members = [".", "crates/*"]
resolver = "2"

[package]
name = "agentic-repos"
version = "0.1.0"
edition = "2021"
description = "Multi-tenant Git server with MCP integration (AGPLv3)"
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Skylet Plugin ABI (for FFI plugin integration)
skylet-abi = { git = "ssh://git@github.com/vincents-ai/skylet.git", default-features = false }
# Web framework
actix-web = "4.4"
actix-cors = "0.7"

# Web UI (Commercial Feature)
mime_guess = "2.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Git operations (legacy — being migrated to gix)

# SSH Server (for Git over SSH)
russh = "0.58"
russh-keys = "0.49"

# Git protocol implementation (pure Rust)
gix = { version = "0.81", default-features = false, features = ["max-performance-safe", "sha1"] }
gix-pack = { version = "0.68", default-features = false, features = ["generate", "streaming-input"] }
gix-protocol = "0.59"
gix-transport = "0.55"

# S3 Storage
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Schema validation
jsonschema = "0.42"
lru = "0.17"

# Configuration
# config crate removed — using git-refs config + serde_yaml for overrides

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Authentication
jsonwebtoken = "9.2"
bcrypt = "0.18"
openssl = "0.10"  # SAML XML-DSIG signature verification (already transitive via russh-keys)
sha1 = "0.10"        # SHA-1 digest for legacy SAML signatures
reqwest = { version = "0.11", features = ["json"] }
aes-gcm = "0.10"
sha2 = { version = "0.10" }
hmac = { version = "0.12" }
oauth2 = "4.4"

# Redis caching
deadpool-redis = "0.18"

# URL handling
url = "2.5"

# Hex encoding
hex = "0.4"

# MCP Protocol
bytes = "1.5"
uuid = { version = "1.6", features = ["v4", "serde"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
async-trait = "0.1"

# Database
# sqlx removed — platform uses git-refs as sole datastore (ADR-025)
chrono = { version = "0.4", features = ["serde"] }

# Age encryption for secrets
age = "0.11"

# Base64 encoding
base64 = "0.22"

# Utilities
walkdir = "2.4"
tempfile = "3.8"
thiserror = "2.0"
regex = "1.10"
http = "1.0"
rand_core = "0.6"

# Metrics
prometheus = "0.13"
lazy_static = "1.4"

# Concurrency utilities (for Skynet plugin)
parking_lot = "0.12"
globset = "0.4"
serde_yaml = "0.9"
quick-xml = "0.36"
ldap3 = "0.11"
flate2 = "1.1.9"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.14"
serial_test = "3.0"
cucumber = "0.22"
futures = "0.3"
portpicker = "0.1"

[[test]]
name = "bdd"
harness = false

[[test]]
name = "e2e"
