[package]
name = "repos-mcp"
version = "0.1.0"
edition = "2021"
description = "Multi-tenant Git server with MCP integration (AGPLv3)"
license = "AGPL-3.0"

[dependencies]
# Web framework
actix-web = "4.4"
actix-cors = "0.6"
actix-files = "0.6"

# Web UI (Commercial Feature)
tera = "1.19"
mime_guess = "2.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Git operations
git2 = "0.18"

# SSH Server (for Git over SSH)
russh = "0.49"
russh-keys = "0.49"

# Git protocol implementation (pure Rust)
gix-protocol = "0.55"
gix-transport = "0.52"

# S3 Storage
aws-config = "1.1"
aws-sdk-s3 = "1.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Authentication
jsonwebtoken = "9.2"
bcrypt = "0.15"
sha2 = "0.10"

# MCP Protocol
bytes = "1.5"
uuid = { version = "1.6", features = ["v4", "serde"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# Utilities
walkdir = "2.4"
tempfile = "3.8"
thiserror = "1.0"
regex = "1.10"
http = "1.0"
rand_core = "0.6"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
serial_test = "3.0"
