# Cargo audit configuration
# This file documents known security advisories that we've assessed and chosen to accept.

[advisories]
# RUSTSEC-2023-0071: Marvin Attack on RSA
# Severity: Medium (5.9)
# Affects: rsa 0.9.10 (via russh 0.49.2)
# Status: No fix available - russh 0.56.0 introduces breaking changes with rand_core version conflicts
# Assessment: This is a timing side-channel attack requiring:
#   1. Physical access to measure timing
#   2. Many thousands of samples
#   3. Sophisticated cryptanalysis
# For our use case (SSH server with ephemeral keys), the risk is acceptable.
# We will revisit when russh resolves the dependency conflicts.
ignore = ["RUSTSEC-2023-0071"]

# RUSTSEC-2026-0002: LRU IterMut unsoundness
# Affects: lru 0.12.5 (via aws-sdk-s3 1.119.0)
# Status: Waiting for AWS SDK update
# Assessment: This is an internal implementation detail of aws-sdk-s3's caching.
# The unsoundness only affects unsafe code using IterMut, which we don't use directly.
# We will revisit when AWS SDK updates their dependencies.
ignore = ["RUSTSEC-2026-0002"]
