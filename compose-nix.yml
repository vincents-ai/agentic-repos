version: '3.8'

services:
  agentic-repos:
    image: agentic-repos:latest
    container_name: agentic-repos
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "8090:8090"
    volumes:
      - ./data:/app/data
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./ssh_keys:/app/.ssh
    environment:
      - RUST_LOG=info
    user: "1000:1000"

volumes:
  repos_data:
    driver: local