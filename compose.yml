version: '3.8'

services:
  agentic-repos:
    build: .
    container_name: agentic-repos
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "8090:8090"
    volumes:
      - ./data:/app/data
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./ssh_keys:/app/.ssh
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  repos_data:
    driver: local