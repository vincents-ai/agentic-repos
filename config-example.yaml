# Example configuration for repos-mcp Git Server
# Copy this file to config.yaml and modify as needed

# Server configuration
server:
  ssh:
    # SSH server port (default: 2222)
    port: 2222
    # Path to SSH host key file (will be generated if doesn't exist)
    host_key_path: "./ssh_host_key"
    # Maximum concurrent SSH connections
    max_connections: 100
    # Connection timeout in seconds
    connection_timeout_secs: 30

# Authentication configuration
auth:
  # Path to authorized_keys file (format: username:ssh-key-type key comment)
  authorized_keys_path: "./authorized_keys"

# RBAC (Role-Based Access Control) configuration
rbac:
  # Enable RBAC system (requires rbac feature flag)
  enabled: false
  # Storage type for RBAC data: "memory" or "database"
  storage_type: "memory"
  # Initial administrator user (created on first startup if rbac enabled)
  admin_user:
    username: "admin"
    email: "admin@localhost"
    # SSH public key for admin user (optional)
    ssh_key: ""

# Storage backend configuration
storage:
  # Storage backend type: "local" or "s3"
  type: "local"
  
  # Local filesystem storage
  local:
    # Base path for repository storage
    path: "./repositories"
  
  # S3-compatible storage (uncomment to use)
  # s3:
  #   bucket: "my-git-repositories"
  #   region: "us-east-1"
  #   # Optional: Custom S3-compatible endpoint
  #   endpoint: "https://s3.amazonaws.com"

# Rate limiting configuration
rate_limit:
  # Enable rate limiting (true/false)
  enabled: true
  
  # Headers to check for proxy IP information (for rate limiting behind proxies)
  proxy_headers:
    - "X-Forwarded-For"
    - "X-Real-IP"
    - "CF-Connecting-IP"
  
  # Global rate limits (applied to all users)
  global_limits:
    # Maximum requests per second globally
    max_requests_per_second: 100
    # Maximum connections per IP address
    max_connections_per_ip: 10
    # Burst size for rate limiting
    burst_size: 20
  
  # Tier-based rate limiting
  tiers:
    # Free tier (default for all users)
    free:
      requests_per_minute: 60
      requests_per_hour: 1000
      burst_size: 10
      concurrent_connections: 5
    
    # Pro tier (for paid users - configure user mapping separately)
    pro:
      requests_per_minute: 300
      requests_per_hour: 10000
      burst_size: 50
      concurrent_connections: 20
    
    # Enterprise tier (for enterprise customers)
    enterprise:
      requests_per_minute: 1000
      requests_per_hour: 100000
      burst_size: 200
      concurrent_connections: 100

# Logging configuration
logging:
  # Log level: trace, debug, info, warn, error
  level: "info"
  # Enable structured JSON logging
  json: false
  # Enable timestamps in logs
  timestamp: true
  # Enable ANSI colors in terminal output
  ansi: true

# Commercial features (require separate licensing)
# Contact shift@someone.section.me for commercial licensing
features:
  # Web UI - Repository management web interface
  web_ui: false
  
  # Authentication integrations
  ldap_auth: false      # LDAP/Active Directory integration
  saml_auth: false      # SAML SSO provider
  oauth_auth: false     # OAuth2/OIDC authentication
  
  # Audit & Governance
  audit_logging: false     # Comprehensive audit logging
  audit_tracking: false   # Tamper-proof access tracking
  repo_templates: false   # Repository templates with policies
  webhooks: false         # Custom webhook integrations
  
  # Performance & Scale
  multi_region: false      # Multi-region replication
  horizontal_scaling: false  # Horizontal scaling support
  redis_cache: false      # Redis caching layer
  load_balancing: false   # Intelligent load balancing
  monitoring: false       # Prometheus/Grafana monitoring
  
  # Security & Compliance
  security_scanning: false  # Repository vulnerability scanning
  soc2_compliance: false   # SOC2 compliance reports
  gdpr_compliance: false   # GDPR data protection features
  hipaa_compliance: false  # HIPAA healthcare compliance
  rbac: false             # Role-based access control
  backup_recovery: false  # Automated backup & disaster recovery
  
  # CI/CD Integration
  github_actions: false   # GitHub Actions integration
  gitlab_ci: false        # GitLab CI integration
  jenkins: false          # Jenkins pipeline integration
  
  # Advanced API & Analytics
  graphql_api: false      # GraphQL API with advanced querying
  advanced_webhooks: false  # Advanced webhook filtering
  analytics: false        # Repository analytics dashboard

