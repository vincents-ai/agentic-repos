server:
  host: "0.0.0.0"
  port: 8090

git:
  ssh:
    port: 2222
    hostkey: "/app/.ssh/host_key"
  authorized_keys: "/app/.ssh/authorized_keys"
  max_connections: 100
  connection_timeout_secs: 300

storage:
  type: local
  local:
    path: "/app/data"

rate_limit:
  enabled: true
  tiers:
    free:
      requests_per_minute: 60
      requests_per_hour: 1000
      burst_size: 10