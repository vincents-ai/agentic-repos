[package]
name = "adp-ci-runner-bin"
version = "0.1.0"
edition = "2021"
description = "ADP CI runner binary — connects to adp, receives jobs, executes them"
license = "AGPL-3.0"

[[bin]]
name = "adp-ci-runner"
path = "src/main.rs"

[dependencies]
adp-ci-types = { path = "../adp-ci-types" }
adp-ci-runner = { path = "../adp-ci-runner" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
futures-util = "0.3"
