[package]
name = "adp-ci-runner"
version = "0.1.0"
edition = "2021"
description = "CI runner execution engine: workspace isolation, secret mounting, log streaming, submodule checkout"
license = "AGPL-3.0"

[dependencies]
adp-ci-types = { path = "../adp-ci-types" }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "process", "io-util"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
thiserror = "1.0"
tempfile = "3.10"
base64 = { version = "0.22", features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "process", "io-util"] }
