[package]
name = "adp-proto"
version = "0.1.0"
edition = "2021"
description = "Shared types and traits for agentic-loop + adp integration"
license = "AGPL-3.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
hostname = "0.4"
