[package]
name = "adp-rbac-engine"
version = "0.1.0"
edition = "2021"
description = "RBAC enforcement engine for service key namespace restrictions"
license = "AGPL-3.0"

[dependencies]
adp-proto = { path = "../adp-proto" }
globset = "0.4"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "2.0"

[dev-dependencies]
