[package]
name = "adp-schema-registry"
version = "0.1.0"
edition = "2021"
description = "Schema registry with validation and caching for ADP ref schemas"
license = "AGPL-3.0"

[dependencies]
adp-proto = { path = "../adp-proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
jsonschema = "0.26"
globset = "0.4"

[dev-dependencies]
