[package]
name = "agentic-loop-entity-writer"
version = "0.1.0"
edition = "2021"
description = "Schema-validated entity writer for agentic-loop instances"
license = "AGPL-3.0"

[dependencies]
adp-proto = { path = "../adp-proto" }
adp-schema-registry = { path = "../adp-schema-registry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
