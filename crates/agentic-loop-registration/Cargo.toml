[package]
name = "agentic-loop-registration"
version = "0.1.0"
edition = "2021"
description = "Service registration for agentic-loop instances with SOPS encryption"
license = "AGPL-3.0"

[dependencies]
adp-proto = { path = "../adp-proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
rand = "0.9"
base64 = "0.22"

[dev-dependencies]
