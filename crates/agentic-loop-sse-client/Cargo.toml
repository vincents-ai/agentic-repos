[package]
name = "agentic-loop-sse-client"
version = "0.1.0"
edition = "2021"
description = "SSE client for connecting agentic-loop instances to adp servers"
license = "AGPL-3.0"

[dependencies]
adp-proto = { path = "../adp-proto" }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
tokio-util = "0.7"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.35", features = ["test-util", "macros"] }
