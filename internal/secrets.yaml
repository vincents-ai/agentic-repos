apiVersion: v1
kind: Secret
metadata:
  name: agentic-repos-secrets
  namespace: agentic-repos
  labels:
    app.kubernetes.io/name: agentic-repos
type: Opaque
stringData:
  # JWT secret - override in each environment
  AGENTIC_REPOS_AUTH__JWT_SECRET: "change-this-in-production"
  
  # AWS credentials - override via external secrets management
  AGENTIC_REPOS_STORAGE__S3__ACCESS_KEY_ID: ""
  AGENTIC_REPOS_STORAGE__S3__SECRET_ACCESS_KEY: ""
  
  # Database credentials
  AGENTIC_REPOS_DATABASE__URL: "postgresql://agentic-repos:agentic-repos@postgres:5432/agentic-repos"