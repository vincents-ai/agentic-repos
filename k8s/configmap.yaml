apiVersion: v1
kind: ConfigMap
metadata:
  name: ogit-config
  namespace: ogit
  labels:
    app.kubernetes.io/name: ogit
data:
  OGIT_STORAGE__TYPE: "s3"
  OGIT_STORAGE__S3__REGION: "us-east-1"
  OGIT_STORAGE__S3__SEAWEEDFS_CACHE: "true"
  OGIT_SERVER__HTTP_HOST: "0.0.0.0"
  OGIT_SERVER__HTTP_PORT: "8080"
  OGIT_SERVER__MCP_HOST: "0.0.0.0"
  OGIT_SERVER__MCP_PORT: "3000"
  OGIT_DATABASE__MAX_CONNECTIONS: "10"
  OGIT_LOGGER__LEVEL: "info"
  OGIT_LOGGER__FORMAT: "json"
