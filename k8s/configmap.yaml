apiVersion: v1
kind: ConfigMap
metadata:
  name: repos-mcp-config
  namespace: repos-mcp
  labels:
    app.kubernetes.io/name: repos-mcp
data:
  REPOS_MCP_STORAGE__TYPE: "s3"
  REPOS_MCP_STORAGE__S3__REGION: "us-east-1"
  REPOS_MCP_STORAGE__S3__SEAWEEDFS_CACHE: "true"
  REPOS_MCP_SERVER__HTTP_HOST: "0.0.0.0"
  REPOS_MCP_SERVER__HTTP_PORT: "8080"
  REPOS_MCP_SERVER__MCP_HOST: "0.0.0.0"
  REPOS_MCP_SERVER__MCP_PORT: "3000"
  REPOS_MCP_DATABASE__MAX_CONNECTIONS: "10"
  REPOS_MCP_LOGGER__LEVEL: "info"
  REPOS_MCP_LOGGER__FORMAT: "json"