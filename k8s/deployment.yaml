apiVersion: apps/v1
kind: Deployment
metadata:
  name: repos-mcp
  namespace: repos-mcp
  labels:
    app.kubernetes.io/name: repos-mcp
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: repos-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: repos-mcp
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: repos-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
        - name: repos-mcp
          image: repos-mcp:latest
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: mcp
              containerPort: 3000
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: repos-mcp-config
            - secretRef:
                name: repos-mcp-secrets
          
          env:
            - name: RUST_LOG
              value: "info"
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          volumeMounts:
            - name: data
              mountPath: /data/repos-mcp
            - name: cache
              mountPath: /var/lib/seaweedfs/cache
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      
      volumes:
        - name: data
          emptyDir: {}
        - name: cache
          emptyDir: {}
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: repos-mcp