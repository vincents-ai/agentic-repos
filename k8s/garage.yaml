# Garage K8s Deployment - Local Development
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: agentic-repos
  labels:
    app.kubernetes.io/name: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      containers:
        - name: garage
          image: garagehq/garage:latest
          ports:
            - containerPort: 3900
              name: s3
            - containerPort: 3901
              name: rpc
          command:
            - /usr/local/bin/garage
            - server
            - --data-dir
            - /var/lib/garage
            - --rpc-port
            - "3901"
            - --s3-port
            - "3900"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: garage-s3
  namespace: agentic-repos
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - port: 3900
      targetPort: s3
      name: s3