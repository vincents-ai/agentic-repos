# Gateway API Configuration for agentic-repos
# Uses Envoy Gateway as GatewayClass controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
  labels:
    app.kubernetes.io/name: agentic-repos
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentic-repos
  namespace: agentic-repos
  labels:
    app.kubernetes.io/name: agentic-repos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentic-repos-http
  namespace: agentic-repos
  labels:
    app.kubernetes.io/name: agentic-repos
spec:
  parentRefs:
    - name: agentic-repos
      namespace: agentic-repos
      sectionName: http
  hostnames: ["agentic-repos.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: agentic-repos
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentic-repos
  namespace: agentic-repos
  labels:
    app.kubernetes.io/name: agentic-repos
spec:
  parentRefs:
    - name: agentic-repos
      namespace: agentic-repos
      sectionName: http
  hostnames: ["mcp.agentic-repos.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: agentic-repos
          port: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: agentic-repos-tls
  namespace: agentic-repos
  labels:
    app.kubernetes.io/name: agentic-repos
spec:
  parentRefs:
    - name: agentic-repos
      namespace: agentic-repos
  hostnames: ["agentic-repos.example.com"]
  rules:
    - backendRefs:
        - name: agentic-repos
          port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agentic-repos-tls
  namespace: agentic-repos
  labels:
    app.kubernetes.io/name: agentic-repos
spec:
  secretName: agentic-repos-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - agentic-repos.example.com