# Gateway API Configuration for repos-mcp
# Uses Envoy Gateway as GatewayClass controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
  labels:
    app.kubernetes.io/name: repos-mcp
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: repos-mcp
  namespace: repos-mcp
  labels:
    app.kubernetes.io/name: repos-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: repos-mcp-http
  namespace: repos-mcp
  labels:
    app.kubernetes.io/name: repos-mcp
spec:
  parentRefs:
    - name: repos-mcp
      namespace: repos-mcp
      sectionName: http
  hostnames: ["repos-mcp.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: repos-mcp
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: repos-mcp-mcp
  namespace: repos-mcp
  labels:
    app.kubernetes.io/name: repos-mcp
spec:
  parentRefs:
    - name: repos-mcp
      namespace: repos-mcp
      sectionName: http
  hostnames: ["mcp.repos-mcp.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: repos-mcp
          port: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: repos-mcp-tls
  namespace: repos-mcp
  labels:
    app.kubernetes.io/name: repos-mcp
spec:
  parentRefs:
    - name: repos-mcp
      namespace: repos-mcp
  hostnames: ["repos-mcp.example.com"]
  rules:
    - backendRefs:
        - name: repos-mcp
          port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: repos-mcp-tls
  namespace: repos-mcp
  labels:
    app.kubernetes.io/name: repos-mcp
spec:
  secretName: repos-mcp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - repos-mcp.example.com