# Staging/Production Overlay - SeaweedFS + S3
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-repos-config-seaweedfs
  namespace: agentic-repos
data:
  REPOS_MCP_STORAGE__S3__SEAWEEDFS_CACHE: "true"
  REPOS_MCP_STORAGE__S3__SEAWEEDFS_CACHE_DIR: "/seaweedfs/cache"
  REPOS_MCP_STORAGE__S3__SEAWEEDFS_CACHE_SIZE: "50G"
  REPOS_MCP_LOGGER__LEVEL: "info"
  REPOS_MCP_LOGGER__FORMAT: "json"