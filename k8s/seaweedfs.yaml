# SeaweedFS K8s Deployment - Staging/Production
# Deploy with: kubectl apply -k k8s/overlays/production

apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: agentic-repos
data:
  s3.yaml: |
    id:
      accessKey: "weedfs_access"
      secretKey: "weedfs_secret"
    buckets:
      - name: "agentic-repos-repos"
        policy: "public_read"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-s3
  namespace: agentic-repos
  labels:
    app.kubernetes.io/name: seaweedfs-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-s3
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          ports:
            - containerPort: 8333
              name: s3
            - containerPort: 8334
              name: s3-api
            - containerPort: 8336
              name: s3-data
            - containerPort: 8337
              name: s3-volume
            - containerPort: 8338
              name: s3-index
          command:
            - /usr/local/bin/seaweedfs
            - server
            - --s3
            - --dir
            - /var/lib/seaweedfs
            - --s3.port
            - "8333"
            - --s3.domain
            - "s3.seaweedfs.local"
            - --master.port
            - "9333"
            - "master.http.port"
            - "9334"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/seaweedfs
      volumes:
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: agentic-repos
spec:
  selector:
    app.kubernetes.io/name: seaweedfs-s3
  ports:
    - port: 8333
      targetPort: s3
      name: s3
    - port: 8334
      targetPort: s3-api
      name: s3-api