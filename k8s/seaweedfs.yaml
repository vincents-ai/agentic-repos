# SeaweedFS K8s Deployment - Staging/Production
# Deploy with: kubectl apply -k k8s/overlays/production

apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: ogit
data:
  s3.yaml: |
    ident:
      accessKey: "weedfs_access"
      secretKey: "weedfs_secret"
    buckets:
      - name: "ogit-repos"
        policy: "public_read"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-s3
  namespace: ogit
  labels:
    app.kubernetes.io/name: seaweedfs-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-s3
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          command:
            - /usr/bin/weed
            - s3
            - -port=8333
            - -master=seaweedfs-master:9333
            - -config=/etc/seaweedfs/s3.yaml
          ports:
            - containerPort: 8333
              name: s3
          volumeMounts:
            - name: config
              mountPath: /etc/seaweedfs/s3.yaml
              subPath: s3.yaml
            - name: cache
              mountPath: /seaweedfs/cache
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: seaweedfs-s3-config
        - name: cache
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-master
  namespace: ogit
  labels:
    app.kubernetes.io/name: seaweedfs-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-master
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          command:
            - /usr/bin/weed
            - master
            - -mdir=/seaweedfs/master
            - -port=9333
          ports:
            - containerPort: 9333
              name: master
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: data
              mountPath: /seaweedfs/master
      volumes:
        - name: data
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-volume
  namespace: ogit
  labels:
    app.kubernetes.io/name: seaweedfs-volume
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-volume
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-volume
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          command:
            - /usr/bin/weed
            - volume
            - -dir=/seaweedfs/volumes
            - -port=8081
            - -mserver=seaweedfs-master:9333
            - -rack=rack1
            - -dc=dc1
          ports:
            - containerPort: 8081
              name: volume
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /seaweedfs/volumes
      volumes:
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: ogit
spec:
  selector:
    app.kubernetes.io/name: seaweedfs-s3
  ports:
    - port: 8333
      targetPort: s3
      name: s3

---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-master
  namespace: ogit
spec:
  selector:
    app.kubernetes.io/name: seaweedfs-master
  ports:
    - port: 9333
      targetPort: master
      name: master
