apiVersion: v1
kind: Secret
metadata:
  name: repos-mcp-secrets
  namespace: repos-mcp
  labels:
    app.kubernetes.io/name: repos-mcp
type: Opaque
stringData:
  # JWT secret - override in each environment
  REPOS_MCP_AUTH__JWT_SECRET: "change-this-in-production"
  
  # AWS credentials - override via external secrets management
  REPOS_MCP_STORAGE__S3__ACCESS_KEY_ID: ""
  REPOS_MCP_STORAGE__S3__SECRET_ACCESS_KEY: ""
  
  # Database credentials
  REPOS_MCP_DATABASE__URL: "postgresql://repos-mcp:repos-mcp@postgres:5432/repos-mcp"