apiVersion: v1
kind: Secret
metadata:
  name: ogit-secrets
  namespace: ogit
  labels:
    app.kubernetes.io/name: ogit
type: Opaque
stringData:
  # JWT secret - override in each environment
  OGIT_AUTH__JWT_SECRET: "change-this-in-production"
  
  # AWS credentials - override via external secrets management
  OGIT_STORAGE__S3__ACCESS_KEY_ID: ""
  OGIT_STORAGE__S3__SECRET_ACCESS_KEY: ""
  
  # Database credentials
  OGIT_DATABASE__URL: "postgresql://ogit:ogit@postgres:5432/ogit"
