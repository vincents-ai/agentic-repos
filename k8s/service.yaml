apiVersion: v1
kind: Service
metadata:
  name: agentic-repos
  namespace: agentic-repos
  labels:
    app.kubernetes.io/name: agentic-repos
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: mcp
      port: 3000
      targetPort: mcp
      protocol: TCP
  selector:
    app.kubernetes.io/name: agentic-repos