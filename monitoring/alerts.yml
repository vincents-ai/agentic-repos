groups:
  - name: lfs_alerts
    interval: 30s
    rules:
      - alert: HighLFSErrorRate
        expr: rate(lfs_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: lfs
        annotations:
          summary: "High LFS error rate detected"
          description: "LFS error rate is {{ $value | humanize }} errors/sec for {{ $labels.tenant }}/{{ $labels.repo }} (error type: {{ $labels.error_type }})"
          runbook_url: "https://github.com/vincents-ai/agentic-repos/blob/main/docs/RUNBOOKS.md#high-lfs-error-rate"

      - alert: LFSUploadLatencyHigh
        expr: histogram_quantile(0.95, rate(lfs_upload_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
          component: lfs
        annotations:
          summary: "LFS upload latency is high"
          description: "P95 upload latency is {{ $value | humanize }}s for {{ $labels.tenant }}/{{ $labels.repo }}"
          runbook_url: "https://github.com/vincents-ai/agentic-repos/blob/main/docs/RUNBOOKS.md#high-lfs-latency"

      - alert: LFSDownloadLatencyHigh
        expr: histogram_quantile(0.95, rate(lfs_download_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
          component: lfs
        annotations:
          summary: "LFS download latency is high"
          description: "P95 download latency is {{ $value | humanize }}s for {{ $labels.tenant }}/{{ $labels.repo }}"
          runbook_url: "https://github.com/vincents-ai/agentic-repos/blob/main/docs/RUNBOOKS.md#high-lfs-latency"

      - alert: LFSStorageErrors
        expr: increase(lfs_errors_total{error_type="storage_error"}[5m]) > 5
        for: 2m
        labels:
          severity: critical
          component: lfs
        annotations:
          summary: "LFS storage backend errors detected"
          description: "{{ $value }} storage errors in the last 5m for {{ $labels.tenant }}/{{ $labels.repo }}"
          runbook_url: "https://github.com/vincents-ai/agentic-repos/blob/main/docs/RUNBOOKS.md#storage-errors"

      - alert: LFSHashMismatchErrors
        expr: increase(lfs_errors_total{error_type="hash_mismatch"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
          component: lfs
        annotations:
          summary: "LFS SHA256 hash mismatches detected"
          description: "{{ $value }} hash mismatch errors detected for {{ $labels.tenant }}/{{ $labels.repo }}. Possible data corruption or malicious activity."
          runbook_url: "https://github.com/vincents-ai/agentic-repos/blob/main/docs/RUNBOOKS.md#hash-mismatch"

      - alert: LFSObjectTooLargeErrors
        expr: rate(lfs_errors_total{error_type="object_too_large"}[5m]) > 0.05
        for: 5m
        labels:
          severity: info
          component: lfs
        annotations:
          summary: "Users hitting LFS object size limits"
          description: "{{ $value | humanize }} objects/sec are being rejected due to size limits for {{ $labels.tenant }}/{{ $labels.repo }}"
          runbook_url: "https://github.com/vincents-ai/agentic-repos/blob/main/docs/RUNBOOKS.md#object-too-large"

      - alert: LFSNoActivity
        expr: rate(lfs_batch_requests_total[30m]) == 0 and lfs_batch_requests_total > 0
        for: 30m
        labels:
          severity: info
          component: lfs
        annotations:
          summary: "No LFS activity detected"
          description: "No LFS batch requests in the last 30 minutes for {{ $labels.tenant }}/{{ $labels.repo }}, but LFS was previously active"

      - alert: LFSHighThroughput
        expr: rate(lfs_upload_bytes_total[5m]) + rate(lfs_download_bytes_total[5m]) > 100000000
        for: 10m
        labels:
          severity: info
          component: lfs
        annotations:
          summary: "High LFS data transfer rate"
          description: "LFS is transferring {{ $value | humanize }}B/s for {{ $labels.tenant }}/{{ $labels.repo }}. Monitor for capacity issues."

      - alert: LFSMetricsDown
        expr: up{job="agentic-repos"} == 0
        for: 2m
        labels:
          severity: critical
          component: lfs
        annotations:
          summary: "agentic-repos metrics endpoint is down"
          description: "Cannot scrape metrics from agentic-repos instance {{ $labels.instance }}"
          runbook_url: "https://github.com/vincents-ai/agentic-repos/blob/main/docs/RUNBOOKS.md#metrics-down"

  - name: lfs_slo_alerts
    interval: 1m
    rules:
      - alert: LFSErrorBudgetBurn
        expr: |
          (
            sum(rate(lfs_errors_total[1h])) 
            / 
            sum(rate(lfs_batch_requests_total[1h]))
          ) > 0.01
        for: 15m
        labels:
          severity: warning
          component: lfs
          slo: error_rate
        annotations:
          summary: "LFS error budget is burning too fast"
          description: "Error rate is {{ $value | humanizePercentage }}, exceeding 1% SLO target"

      - alert: LFSLatencySLOViolation
        expr: |
          histogram_quantile(0.99, 
            sum(rate(lfs_upload_duration_seconds_bucket[5m])) by (le)
          ) > 30
        for: 10m
        labels:
          severity: warning
          component: lfs
          slo: latency
        annotations:
          summary: "LFS upload latency SLO violation"
          description: "P99 upload latency is {{ $value | humanize }}s, exceeding 30s SLO target"
