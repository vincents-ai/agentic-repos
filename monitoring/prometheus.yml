global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'repos-mcp'
    environment: 'production'

scrape_configs:
  - job_name: 'repos-mcp'
    static_configs:
      - targets: ['localhost:8090']
        labels:
          service: 'repos-mcp'
          component: 'lfs'
    
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'repos-mcp-main'

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
