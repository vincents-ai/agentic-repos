# Test configuration with Web UI enabled
server:
  host: "127.0.0.1"
  port: 8090
  ssh:
    port: 2222
    host_key_path: "./test_ssh_host_key"
    max_connections: 100
    connection_timeout_secs: 30

auth:
  authorized_keys_path: "./test_authorized_keys"

storage:
  type: "local"
  local:
    path: "./test_repositories"

features:
  # Enable Web UI for testing
  web_ui: true
  
  # Disable all other commercial features
  ldap_auth: false
  saml_auth: false
  oauth_auth: false
  audit_logging: false
  audit_tracking: false
  repo_templates: false
  webhooks: false
  multi_region: false
  horizontal_scaling: false
  redis_cache: false
  load_balancing: false
  monitoring: false
  security_scanning: false
  soc2_compliance: false
  gdpr_compliance: false
  hipaa_compliance: false
  rbac: false
  backup_recovery: false
  github_actions: false
  gitlab_ci: false
  jenkins: false
  graphql_api: false
  advanced_webhooks: false
  analytics: false